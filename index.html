<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particles Swarm Export</title>
    <style>body { margin: 0; overflow: hidden; background: #000; }</style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        const COUNT = 30000;
        const AUTO_SPIN = true;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 0, 60);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = AUTO_SPIN;
        controls.autoRotateSpeed = 2.0;

        // ГЕОМЕТРИЯ ТОЧЕК
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(COUNT * 3);
        const colors = new Float32Array(COUNT * 3);
        
        for (let i = 0; i < COUNT; i++) {
            positions[i * 3] = (Math.random() - 0.5) * 100;
            positions[i * 3 + 1] = (Math.random() - 0.5) * 100;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 100;
            colors[i * 3] = 1.0;
            colors[i * 3 + 1] = 1.0;
            colors[i * 3 + 2] = 1.0;
        }
        
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        
        // Материал точек (чистые точки без обводки и свечения)
        const material = new THREE.PointsMaterial({ 
            size: 0.35, 
            vertexColors: true, 
            sizeAttenuation: true,
            transparent: false
        });

        const points = new THREE.Points(geometry, material);
        scene.add(points);

        const PARAMS = {};
        const addControl = (id, label, min, max, val) => PARAMS[id] !== undefined ? PARAMS[id] : val;
        const setInfo = () => {};
        const annotate = () => {};

        const clock = new THREE.Clock();
        const color = new THREE.Color();

        function smoothstep(edge0, edge1, x) {
            const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
            return t * t * (3 - 2 * t);
        }

        // ЗАГРУЗКА ВАШЕГО ЛОГОТИПА ИЗ SVG
        const logoImg = new Image();
        logoImg.crossOrigin = "anonymous";
        logoImg.src = "https://raw.githubusercontent.com/kviktoriia2018-creator/logo-data/main/Frame%201948755463.svg";

        const logoData = [];
        const logoScale = 0.25; // Масштаб лого (если слишком большое, уменьшите, например, до 0.15)
        const logoSize = 256;

        logoImg.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = logoSize;
            canvas.height = logoSize;
            const ctx = canvas.getContext('2d');
            
            ctx.drawImage(logoImg, 0, 0, logoSize, logoSize);
            const imgData = ctx.getImageData(0, 0, logoSize, logoSize).data;

            const step = 2;
            for (let y = 0; y < logoSize; y += step) {
                for (let x = 0; x < logoSize; x += step) {
                    const index = (y * logoSize + x) * 4;
                    const alpha = imgData[index + 3];
                    
                    if (alpha > 128) {
                        const nx = (x - logoSize / 2) * logoScale;
                        const ny = (logoSize / 2 - y) * logoScale;
                        logoData.push({ x: nx, y: ny, z: 0 });
                    }
                }
            }
        };

        function getLogoPoint(i) {
            if (logoData.length === 0) return { x: 0, y: 0, z: 0 };
            const idx = Math.floor(i / 5) % logoData.length;
            return logoData[idx];
        }

        // ЛОГИКА ЛУЧЕЙ (12 аккуратных лучей)
        function getRayPoint(i) {
            const numRays = 12;
            const rayIndex = i % numRays;
            const rayCount = Math.floor(COUNT / numRays);
            const rayT = Math.floor(i / numRays) / (rayCount - 1);
            const rayRadius = rayT * 25 + 1;
            const rayAngle = (rayIndex / numRays) * Math.PI * 2;
            
            return {
                x: Math.cos(rayAngle) * rayRadius,
                y: Math.sin(rayAngle) * rayRadius,
                z: 0.0
            };
        }

        // ЛОГИКА ЭКВАЛАЙЗЕРА (ИСПРАВЛЕНА: теперь принимает time)
        function getEqPoint(i, time) {
            const eqSpacing = 10; 
            const eqIdx = Math.floor(i / eqSpacing);
            const eqCount = Math.floor(COUNT / eqSpacing);
            const x = (eqIdx / (eqCount - 1) - 0.5) * 50;
            
            const edge = Math.exp(-Math.pow((x / 50) * 4.0, 4));
            const freq = 4.0;
            const amp = 3.0;
            const t = time;
            
            let wave = 0;
            wave += Math.sin(x * freq - t) * 1.0;
            wave += Math.sin(x * freq * 1.125 + t * 1.3) * 0.7;
            wave += Math.sin(x * freq * 1.25 - t * 0.8) * 0.5;
            wave += Math.sin(x * freq * 1.5 + t * 1.1) * 0.3;
            wave += Math.sin(x * freq * 0.95 - t * 0.6) * 0.4;
            wave *= amp * edge;
            
            return { x, y: wave, z: 0.0 };
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            controls.update();

            const posAttr = geometry.attributes.position;
            const colAttr = geometry.attributes.color;

            const cycleTime = time % 20.0;

            let mix1 = 0, mix2 = 0, mix3 = 0;

            if (cycleTime < 5) {
                mix1 = smoothstep(4, 5, cycleTime);
            } else if (cycleTime < 10) {
                mix1 = 1;
                mix2 = smoothstep(9, 10, cycleTime);
            } else if (cycleTime < 15) {
                mix1 = 1;
                mix2 = 1;
            } else {
                mix1 = 1;
                mix2 = 1;
                mix3 = smoothstep(14, 15, cycleTime);
            }

            for(let i=0; i<COUNT; i++) {
                const logo = getLogoPoint(i);
                const ray = getRayPoint(i);
                const eq = getEqPoint(i, time); // Передаем time

                let tx = logo.x * (1 - mix1) + ray.x * mix1;
                let ty = logo.y * (1 - mix1) + ray.y * mix1;
                let tz = logo.z * (1 - mix1) + ray.z * mix1;

                tx = tx * (1 - mix2) + eq.x * mix2;
                ty = ty * (1 - mix2) + eq.y * mix2;
                tz = tz * (1 - mix2) + eq.z * mix2;

                tx = tx * (1 - mix3) + logo.x * mix3;
                ty = ty * (1 - mix3) + logo.y * mix3;
                tz = tz * (1 - mix3) + logo.z * mix3;

                posAttr.array[i * 3] = tx;
                posAttr.array[i * 3 + 1] = ty;
                posAttr.array[i * 3 + 2] = tz;
                
                let r = 1.0, g = 1.0, b = 1.0;

                r = r * (1 - mix1) + 0.3 * mix1;
                g = g * (1 - mix1) + 0.8 * mix1;
                b = b * (1 - mix1) + 1.0 * mix1;

                r = r * (1 - mix2) + 1.0 * mix2;
                g = g * (1 - mix2) + 1.0 * mix2;
                b = b * (1 - mix2) + 1.0 * mix2;

                r = r * (1 - mix3) + 1.0 * mix3;
                g = g * (1 - mix3) + 1.0 * mix3;
                b = b * (1 - mix3) + 1.0 * mix3;

                colAttr.array[i * 3] = r;
                colAttr.array[i * 3 + 1] = g;
                colAttr.array[i * 3 + 2] = b;
                
                if (i === 0) {
                    setInfo("Лого-Лучи-Эквалайзер", "Полный цикл: Логотип -> Лучи -> Эквалайзер -> Логотип.");
                }
            }
            
            posAttr.needsUpdate = true;
            colAttr.needsUpdate = true;

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
